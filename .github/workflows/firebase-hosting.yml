name: Deploy Sadara to Firebase Hosting

# `secrets` is not available in an `if:` condition.
#
# GitHub exposes the secrets context to `run:` steps and to the job's `env`, and
# not to the expression that decides whether a job or a step runs at all. So a
# condition written as `if: secrets.X != ''` does not fail at run time -- it fails
# to parse, the whole workflow file is rejected, and nothing runs: not the checks,
# not the deploy. It was rejected for exactly that reason, twice, with the error
# pointing at the two lines below and not at anything anyone had done to the code.
#
# The question "is the service account there?" is therefore asked once, inside a
# step that is allowed to ask it, and answered as an output. The job and the step
# then decide on that output, which is a value they are allowed to read.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, so a broken deployable copy is caught even before the
  # Firebase service account exists -- and it is also where the two questions the
  # later steps are not allowed to ask get asked.
  verify:
    runs-on: ubuntu-latest
    outputs:
      has_service_account: ${{ steps.gate.outputs.has_service_account }}
      deploy_firestore_rules: ${{ steps.gate.outputs.deploy_firestore_rules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the deployable copy matches the source tree
        run: |
          set -e
          for f in app.js styles.css index.html firebase-adapter.js firebase-config.js sw.js manifest.webmanifest; do
            if ! diff -q "$f" "firebase-public/$f" >/dev/null 2>&1; then
              echo "::error file=$f::firebase-public/$f is out of sync with the root copy"
              exit 1
            fi
          done
      - name: The public registration folder is published and identical
        run: |
          set -e
          # istimara/ is hand-written and copied into firebase-public by the
          # build. A folder that exists only in one of the two places means the
          # live form is either missing or serving yesterday's copy.
          for f in index.html istimara.css istimara.js print.js algeria.js communes.json; do
            if [ ! -f "firebase-public/istimara/$f" ]; then
              echo "::error file=istimara/$f::missing from firebase-public, /istimara/ would 404"
              exit 1
            fi
            if ! diff -q "istimara/$f" "firebase-public/istimara/$f" >/dev/null 2>&1; then
              echo "::error file=istimara/$f::firebase-public/istimara/$f is out of sync with the source copy"
              exit 1
            fi
          done
      - name: Every asset the site references must be published
        run: |
          set -e
          for f in assets/logo.png assets/form-registration-01.jpg assets/form-registration-02.jpg \
                   assets/internal-regulations.jpg assets/registration-card.jpg \
                   assets/icon-192.png assets/icon-512.png assets/icon-maskable.png; do
            if [ ! -f "firebase-public/$f" ]; then
              echo "::error file=$f::missing from firebase-public, the site would 404"
              exit 1
            fi
          done
      - name: Nothing private may reach the repository
        run: |
          set -e
          for f in sadara.db sadara-local.db "Card Number.docx"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::a private file is tracked in the repository"
              exit 1
            fi
          done
          if git ls-files 'uploads/*' | grep -q .; then
            echo "::error::signed registration copies must never be committed"
            exit 1
          fi

      # The one place a secret may be read, and the two answers the rest of the
      # file decides on. Never printed, and never used as a value in a shell line.
      - name: Decide what may be deployed
        id: gate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_RULES: ${{ secrets.DEPLOY_FIRESTORE_RULES }}
        run: |
          set -e
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "has_service_account=true" >> "$GITHUB_OUTPUT"
            echo "the service account is present; hosting may be deployed"
          else
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
            echo "no service account: hosting is skipped and the checks above still ran"
          fi
          if [ "$DEPLOY_RULES" = "true" ]; then
            echo "deploy_firestore_rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_firestore_rules=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Skipped until the service account is stored, so a fresh fork stays green.
    # The question is asked above, where a secret can be read.
    if: ${{ needs.verify.outputs.has_service_account == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project id lives in .firebaserc, so switching projects is one edit
      # in the repository rather than a change in two places.
      - name: Read the configured project
        id: config
        run: |
          set -e
          id="$(node -p "require('./.firebaserc').projects.default")"
          test -n "$id" || { echo "::error::.firebaserc has no default project"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "deploying to $id"

      - name: Write the service account to disk
        # Through `env:` rather than by writing `${{ secrets... }}` into the script
        # itself: an interpolated secret sits in the command line of the step, and a
        # step that fails prints its command.
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          printf '%s' "$SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"
          test -s "${{ runner.temp }}/firebase-sa.json" || { echo "::error::FIREBASE_SERVICE_ACCOUNT is empty"; exit 1; }

      - name: Deploy Firestore and Storage rules
        # Held back on purpose.
        #
        # The rules running on the project are NOT the copy in this repository.
        # They are stricter: they refuse a registration that does not name its
        # application_type, and they refuse any field that is not on a list. This
        # file does not. It was found the hard way -- the public form was answering
        # every registration with "you do not have permission", which turned out to
        # be this difference and nothing else.
        #
        # So publishing this file would not be a no-op: it would widen what is
        # allowed, on a live database, without anyone having read what it replaces.
        # That has to be a decision somebody makes, not a side effect of adding a
        # service account.
        #
        # NOTE: the copy in the repository was published on 2026-10-13, by hand and
        # deliberately, to open a member's own records to that member -- the roster
        # had been shut so far that a member could not read their own card. That
        # decision was taken, read and made; this step has not caught up with it.
        if: ${{ needs.verify.outputs.deploy_firestore_rules == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@latest deploy --only firestore:rules,storage --project "${{ steps.config.outputs.id }}" --non-interactive

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ${{ steps.config.outputs.id }}
          channelId: live
          entryPoint: .