name: Deploy Sadara to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the deployable copy matches the source tree
        run: |
          set -e
          for f in app.js styles.css index.html firebase-adapter.js firebase-config.js; do
            if ! diff -q "$f" "firebase-public/$f" >/dev/null; then
              echo "::error file=$f::firebase-public/$f is out of sync with the root copy"
              exit 1
            fi
          done

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: sadara-platform
          channelId: live
          entryPoint: .

      - name: Deploy Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools deploy --only firestore:rules,storage --project sadara-platform