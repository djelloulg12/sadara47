# name: Keep the platform awake
#
# المنصة على Render المجاني تُنام بعد 15 دقيقة بلا طلب وارد، وتستيقظ بعد ~دقيقة.
# وهذه النبضة تمنع النوم خلال ساعات عمل النادي.
#
# النبضة تُقاس بالنشاط لا بالساعة
# --------------------------------
# النبضة التي تردّ دائمًا تُبقي الخدمة مستيقظة، لكنها تدفع الثمن كاملًا: 527
# ساعة شهريًّا، حتى في الساعة التي لم يفتح فيها أحد شيئًا. والصواب أن تُقاس
# الحاجة بالنشاط: إن ورد طلب قبل أقل من 14 دقيقة، فالخدمة مستيقظة من تلقاء
# نفسها، والنبضة لا تفعل شيئًا وتردّ `skipped: true`.
#
# فالنبضة هنا لا تُنفق من رصيد Render إلا حين يكون الخادم ساكنًا فعلًا. وهذا هو
# الاستعمال الحقيقي: منصة تُقرأ نهارًا تُبقي نفسها، ومنصة يُنسى أمرها تنام.
#
# الحساب الذي يقوم عليه كل شيء:
#   Render يمنح 750 ساعة تشغيل شهريًا، والشهر 744 ساعة. الرقم مصمَّم بقصد:
#   خدمة واحدة تعمل دائمًا. لكن إن استُهلكت الساعات، يوقف Render كل الخدمات
#   المجانية حتى أول الشهر التالي -- فالخطأ في الحساب ليس تباطؤًا، بل توقّف.
#
#   17 ساعة/يوم (06:00–22:59 UTC) × 31 يومًا = 527 ساعة، وقبلها هامش 223 ساعة.
#   وبتخطّي النبض أثناء النشاط ينزل الاستهلاك تحت ذلك. ولماذا لا 24 ساعة؟ لأن
#   النادي لا يستعمل المنصة في الثالثة فجرًا، وساعات محسوبة بلا داعٍ خطرٌ لا
#   فائدة منه.
#
# عمال الجزائر UTC+1: النافذة تغطّي 07:00–23:59 بتوقيت الجزائر.
#
# ولماذا GitHub Actions؟ مجاني لهذا المستودع العام، وبلا حساب جديد ولا بطاقة.
# وخدمة cron-job.org خارجية تصلح بديلًا لو توقّف Actions.

on:
  schedule:
    # كل 14 دقيقة، من الساعة 6 حتى 22 (UTC). 15 دقيقة هي مهلة نوم Render،
    # و14 تسبقها بدقيقة: نبضة تأخّرت قليلًا لا تترك فجوة.
    - cron: '*/14 6-22 * * *'
  workflow_dispatch:

# نبضتان متلاحمتان لا معنى لهما. والتزامن يمنع تراكم تشغيلات إن تأخّر جدول.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the two addresses
        id: config
        # العنوان والرمز لا يُكتبان في الملف: عنوان الخدمة يتغيّر مع الاسم
        # المتاح، والرمز سرّ. كلاهما من إعدادات المستودع.
        env:
          PLATFORM_URL: ${{ vars.SADARA_PLATFORM_URL }}
          WAKE_TOKEN: ${{ secrets.SADARA_WAKE_TOKEN }}
        run: |
          set -e
          if [ -z "$PLATFORM_URL" ]; then
            echo "::warning::SADARA_PLATFORM_URL is not set: nothing to ping, and the platform will sleep. Set it in Settings -> Secrets and variables -> Actions -> Variables."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$WAKE_TOKEN" ]; then
            echo "::error::SADARA_WAKE_TOKEN is not set: /api/wake refuses every request without it, so the platform would sleep anyway."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping if the server has been quiet, and fail loudly if the answer is wrong
        if: ${{ steps.config.outputs.skip == 'false' }}
        env:
          PLATFORM_URL: ${{ vars.SADARA_PLATFORM_URL }}
          WAKE_TOKEN: ${{ secrets.SADARA_WAKE_TOKEN }}
        run: |
          set -e
          # الشرطة المائلة في النهاية قد تكرّر، فنزيلها قبل اللصق.
          base="${PLATFORM_URL%/}"
          url="$base/api/wake?token=$WAKE_TOKEN"

          # نقرأ الجسم مع الرمز: الجسم يقول هل نبضت فعلًا أم تخطّت.
          # والرمز في العنوان، فلا يُطبع العنوان نفسه في أي سجل.
          # و`-w` يكتب الرمز في آخر سطر، فنفصله عن الجسم.
          resp="$(curl -sS --max-time 90 -w $'\n%{http_code}' "$url" || printf '\n000')"
          code="$(printf '%s' "$resp" | tail -n1)"
          body="$(printf '%s' "$resp" | sed '$d')"
          echo "HTTP $code"

          case "$code" in
            200)
              # التمييز المهم: `skipped: true` ليست فشلًا، بل نجاح -- معناها
              # أن هناك نشاطًا قبل أقل من 14 دقيقة، فالخدمة مستيقظة أصلًا
              # ولم تُنفق هذه النبضة شيئًا من الرصيد.
              if printf '%s' "$body" | grep -q '"skipped":true'; then
                echo "the platform is already awake from real use (the pulse spent nothing)"
              else
                echo "the platform was quiet and the pulse woke it"
              fi
              ;;
            404)
              # 404 تعني أن الرمز لا يطابق ما في الخادم. وإن كان الخادم نائمًا
              # فـcurl يوقظه، ثم يردّ 404. فالرسالة تقول السبب المحتمل بدقة.
              echo "::error::the server answered 404: SADARA_WAKE_TOKEN here does not match the one set on Render. Fix the value in one of the two places."
              exit 1
              ;;
            000)
              echo "::error::no answer within 90s. A sleeping free service wakes in about a minute; if this repeats, the service is down or the URL is wrong."
              exit 1
              ;;
            *)
              echo "::error::unexpected status $code from $base/api/wake"
              exit 1
              ;;
          esac
